<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="todo.css">
</head>
<body>
    <div class="container">
        <div class="todo">
            <h2>Todo List</h2>
            <div class="input-bar">
                <input class="input-name" type="text" placeholder="Enter todo">
                <input class="input-date" type="date">
                <button onclick="addTodo()" class="add-btn">Add</button>

            </div>

            <div class="lists"></div>
        </div>
    </div>

    <script src="todo.js"></script>
    
</body>
</html>
